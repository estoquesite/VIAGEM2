<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segurança - Roteiro Europa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 select-none">

    <!-- TELA DE BLOQUEIO EXTERNA (APENAS CELULAR: md:hidden) -->
    <div id="bloqueio-mobile" class="bg-white p-6 sm:p-8 rounded-3xl shadow-2xl max-w-sm w-full space-y-4 text-center text-xs text-slate-800 md:hidden">
        <div class="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-2xl font-black shadow-inner">
            🔒
        </div>
        <div>
            <h2 class="text-sm font-black text-slate-900">Área Protegida</h2>
            <p class="text-slate-500 mt-0.5 text-[11px]">Utilize a sua biometria (digital ou rosto) para entrar.</p>
        </div>
        <div class="space-y-2.5 pt-2">
            <!-- BOTÃO EXCLUSIVO DE BIOMETRIA / DIGITAL -->
            <button onclick="desbloquearComBiometria()" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold py-3.5 rounded-xl transition shadow-md text-xs flex items-center justify-center gap-2 cursor-pointer">
                <span class="text-base">👆</span>
                <span>Entrar com Digital</span>
            </button>
        </div>
        <div id="erro-biometria" class="text-red-500 font-bold text-[11px] hidden">Falha ao ler biometria. Toque novamente para tentar.</div>
    </div>

    <!-- MENSAGEM VISÍVEL APENAS NO PC ENQUANTO REDIRECIONA -->
    <div class="hidden md:flex flex-col items-center justify-center text-center space-y-2">
        <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-xs text-slate-400">Acesso livre no computador. Redirecionando...</p>
    </div>

    <script>
        const APP_PRINCIPAL = "app.html"; 

        // Se for computador/desktop (largura >= 768px), entra direto sem pedir digital
        function checarAcessoDesktop() {
            if (window.innerWidth >= 768) {
                window.location.href = APP_PRINCIPAL;
                return true;
            }
            return false;
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (checarAcessoDesktop()) return;

            // Se for celular e já tiver validado na sessão atual, entra
            if (sessionStorage.getItem('sessao_ativa_v269') === 'true') {
                window.location.href = APP_PRINCIPAL;
            } else {
                // Abre no celular já chamando o leitor biométrico nativo
                setTimeout(desbloquearComBiometria, 400);
            }
        });

        // Autenticação exclusiva por biometria (Digital / Face ID)
        async function desbloquearComBiometria() {
            const erroEl = document.getElementById('erro-biometria');
            erroEl.classList.add('hidden');

            if (!window.PublicKeyCredential) {
                erroEl.innerText = "Biometria indisponível neste navegador.";
                erroEl.classList.remove('hidden');
                return;
            }

            try {
                const suporte = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
                if (!suporte) {
                    erroEl.innerText = "Nenhuma biometria ativa configurada no aparelho.";
                    erroEl.classList.remove('hidden');
                    return;
                }

                const challenge = new Uint8Array(32);
                window.crypto.getRandomValues(challenge);

                const options = {
                    publicKey: {
                        challenge: challenge,
                        rp: { name: "Roteiro Europa" },
                        user: {
                            id: new Uint8Array([1, 2, 3, 4]),
                            name: "usuario",
                            displayName: "Usuário Autorizado"
                        },
                        pubKeyCredParams: [{ type: "public-key", alg: -7 }],
                        authenticatorSelection: {
                            authenticatorAttachment: "platform",
                            userVerification: "required"
                        },
                        timeout: 60000
                    }
                };

                const cred = await navigator.credentials.create(options);
                if (cred) {
                    sessionStorage.setItem('sessao_ativa_v269', 'true');
                    window.location.href = APP_PRINCIPAL;
                }
            } catch (err) {
                if (err.name !== "NotAllowedError") {
                    erroEl.innerText = "Leitura não reconhecida. Tente de novo.";
                    erroEl.classList.remove('hidden');
                }
            }
        }
    </script>
</body>
</html>
